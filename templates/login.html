<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORTEX | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <a href="{{ url_for('view.index') }}" class="back-link">Volver al inicio</a>
      
      <img src="{{ url_for('static', filename='img/logo_vortex.png') }}" alt="VORTEX" class="logo-img" style="display: block; margin: 0 auto 1.5rem; height: 56px;">
      
      <h1>Iniciar sesión</h1>
      <p class="auth-subtitle">Accede a tu panel de VORTEX</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
        </div>

        <button type="submit" class="primary-btn" style="width: 100%;">Entrar</button>

        <p class="bottom-text">
          No tienes cuenta? <a href="{{ url_for('view.registro_usuario') }}">Regístrate</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
